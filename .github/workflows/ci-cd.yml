  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition devops-assignment-8byte-app \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          python - <<'PY'
          import json
          import os

          with open("task-definition.json") as f:
              task = json.load(f)

          image = os.environ["IMAGE"]

          for container in task["containerDefinitions"]:
              if container["name"] == "app":
                  container["image"] = image

          fields = [
              "family",
              "taskRoleArn",
              "executionRoleArn",
              "networkMode",
              "containerDefinitions",
              "volumes",
              "placementConstraints",
              "requiresCompatibilities",
              "cpu",
              "memory",
              "runtimePlatform"
          ]

          cleaned = {k: task[k] for k in fields if k in task}

          with open("task-definition-new.json", "w") as f:
              json.dump(cleaned, f)
          PY

      - name: Register new task definition
        id: task-def
        run: |
          TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "TASK_DEFINITION=$TASK_DEFINITION" >> "$GITHUB_ENV"

      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION"

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify ECS service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].{Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}" \
            --output table